[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimicry-auth-demo"
version = "0.1.0"
description = "Facial expression biometric authentication demo"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mimicry-preproc>=0.1",
    "npbk>=0.1",
    "streamlit>=1.35",
    "streamlit-webrtc>=0.47",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "altair>=5.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
mimicry-demo = "mimicry_auth_demo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mimicry_auth_demo"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
